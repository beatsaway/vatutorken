  <style>
    :root {
      --bg: #ffffff;
      --ink: #111;
      --muted: #5a5a5a;
      --accent: #1a6b4a;
      --hairline: #e8e8e8;
      --font: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      --serif: "Georgia", "Songti TC", "PMingLiU", ui-serif, serif;
      --lang-bar-h: 2.25rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
    }
    body.lightbox-on { overflow: hidden; }

    .lang-bar {
      position: sticky;
      top: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: var(--lang-bar-h);
      border-bottom: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }
    .lang-bar button {
      margin: 0;
      padding: 0 0.85rem;
      height: 100%;
      border: none;
      background: transparent;
      font: inherit;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .lang-bar button:hover {
      color: var(--ink);
    }
    .lang-bar button.is-active {
      color: var(--accent);
      font-weight: 600;
    }
    .lang-bar .sep {
      width: 1px;
      height: 0.9rem;
      background: var(--hairline);
    }

    .page {
      max-width: min(104rem, calc(100vw - 1.5rem));
      margin: 0 auto;
      padding: 2rem 0.75rem 4rem;
    }
    @media (min-width: 540px) {
      .page { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
    @media (min-width: 900px) {
      .page { padding-left: 2rem; padding-right: 2rem; }
    }

    header {
      padding-bottom: 1.75rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--hairline);
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      font-weight: 600;
      margin: 0 0 0.4rem;
      letter-spacing: 0.01em;
      line-height: 1.25;
    }
    .tagline {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    section { margin-bottom: 2.75rem; }
    h2 {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: var(--ink);
    }
    h3 {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 1.75rem 0 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    h3:first-of-type { margin-top: 0; }

    .note {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }

    p { margin: 0 0 1rem; }
    p:last-child { margin-bottom: 0; }
    a { color: var(--accent); text-underline-offset: 0.15em; }

    figure { margin: 0; }

    .thumb {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      cursor: zoom-in;
      font: inherit;
    }
    .thumb:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    figure.hero {
      max-width: min(100%, 38rem);
      margin-inline: auto;
    }
    .hero img {
      width: 100%;
      height: auto;
      max-height: min(52vh, 28rem);
      display: block;
      object-fit: contain;
      border-radius: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
      gap: 1.25rem;
    }
    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
      }
    }

    .tile {
      border-top: 1px solid var(--hairline);
      padding-top: 0.75rem;
    }
    .tile .thumb > img {
      width: 100%;
      height: 11rem;
      object-fit: cover;
      display: block;
      border-radius: 2px;
    }
    .tile--portrait .thumb {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 13rem;
      max-height: 16rem;
      background: #fafafa;
      padding: 0.5rem;
      border-radius: 2px;
    }
    .tile--portrait .thumb > img {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 15rem;
      object-fit: contain;
    }
    .label {
      margin: 0.5rem 0 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .panel {
      padding-top: 1rem;
      border-top: 1px solid var(--hairline);
      max-width: 50rem;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--hairline);
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: zoom-out;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .lightbox.is-open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox-img {
      cursor: default;
      display: block;
      max-width: min(94vw, 72rem);
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
    }
    .lightbox-img:focus { outline: none; }
    .lightbox-img:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    .lightbox-caption {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: default;
    }
    .lightbox-caption[hidden] {
      display: none;
    }

</head>

      var LANG_STORAGE = "vatutor_lang";

      });

      lb.addEventListener("click", function (e) {
        if (e.target === lb) closeLb();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && lb.classList.contains("is-open")) closeLb();
      });
    })();
  </script>
</body>
</html>
